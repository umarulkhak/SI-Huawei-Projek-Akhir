<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <link rel="shortcut icon" href="{{ url_for('static', filename='image2.svg') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <script src="https://kit.fontawesome.com/d0aa4ac324.js" crossorigin="anonymous"></script>
  <title>{% block title %}Analisis Sentimen EDOM | PHB{% endblock %}</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <span class="brand-mark"><i class="fa-solid fa-chart-line"></i></span>
        <span class="brand-copy">
          <strong>EDOM Insight</strong>
          <small>Politeknik Harapan Bersama</small>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavigation"
        aria-controls="mainNavigation" aria-expanded="false" aria-label="Buka navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
              href="{{ url_for('home') }}"><i class="fa-solid fa-house"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'predik' %}active{% endif %}"
              href="{{ url_for('predik') }}"><i class="fa-solid fa-wand-magic-sparkles"></i> Analisis</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'data' %}active{% endif %}"
              href="{{ url_for('data') }}"><i class="fa-solid fa-table-list"></i> Data</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center">
      <span>EDOM Insight <span class="footer-divider">·</span> Analisis Sentimen</span>
      <span>Politeknik Harapan Bersama</span>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>
</body>

</html>
